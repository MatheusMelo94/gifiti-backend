# Spanish (Latin America & Caribbean, BCP-47 es-419) message bundle for the Gifiti backend.
# Loaded by I18nConfig#messageSource. Keys not present here fall back to messages.properties.
#
# Per ADR 0009 Decisions A + B + F:
# - Decision A: single Spanish variant es-419 (no es-ES / es-MX in scope).
# - Decision B: auth and validation error copy is NOT localized here — frontend
#   narrows on the errorCode discriminator and renders Spanish copy from its own
#   translation pipeline. The keys below are only the ones the backend renders
#   server-side at the wire (access-code errors + transactional emails).
# - Decision F: email templates are MessageSource-based (no HTML template files).
#   Adding a new locale = 1 enum value + 1 properties file with the email keys.
#
# In-scope key set (22 keys): 4 access-code + 9 verification email + 9 password
# reset email. Pinned by I18nBundleParityTest.
#
# Translation: AI-drafted, matching tone of pt-BR bundle (formal but warm).
# User spot-check completed before merge (per spec § Decision C).

# --- Feature 009 / T9 — auth errorCode human-readable copy (es-419) ---
# Per ADR 0009 Decision B + Decision G; frontend narrows on errorCode, this
# is server-side fallback for the message field. WEAK_PASSWORD copy is generic.
error.auth.password.weak=Tu contraseña es demasiado débil. Por favor, elige una más fuerte.
error.auth.email.not.verified=Correo electrónico no verificado. Por favor, verifica tu correo antes de iniciar sesión.
error.auth.already.verified=El correo electrónico ya está verificado

# --- Feature 008 (private wishlist access codes) — T12 parity ---
# Paridade en-US ↔ pt-BR ↔ es-419 per ADR 0009 Decision A.
error.wishlist.access-code.required=Código de acceso obligatorio
error.wishlist.access-code.invalid=Código de acceso inválido
error.wishlist.access-code.rate-limited=Demasiados intentos. Inténtalo de nuevo más tarde.
error.wishlist.access-code.rotate.public-visibility=No se puede rotar el código de acceso de una lista pública

# --- Verification email (sent on register + resendVerification) ---
# Feature 005 — same template chrome rendered by EmailTemplateRenderer for all locales.
# SECURITY: the fallback.link {0} placeholder must remain identical to en-US / pt-BR
# (F-6 amendment from feature 005). Do NOT replace {0} with a hardcoded URL.
email.verification.subject=Bienvenido a Gifiti - Por favor, confirma tu correo electrónico
email.verification.welcome=Bienvenido a
email.verification.body=Gracias por registrarte. Por favor, confirma tu dirección de correo electrónico para comenzar a crear y compartir listas de deseos con amigos y familiares.
email.verification.cta=Confirmar dirección de correo
email.verification.fallback.notice=¿El botón no funciona? Copia y pega este enlace en tu navegador:
email.verification.fallback.link={0}
email.verification.ignore.notice=Si no creaste una cuenta en Gifiti, puedes ignorar este correo con seguridad.
email.verification.footer.copyright=&copy; 2026 Gifiti. Todos los derechos reservados.
email.verification.footer.signup=Recibiste este correo porque te registraste en

# --- Password reset email (sent on forgotPassword for known users) ---
# SECURITY: the fallback.link {0} placeholder must remain identical to en-US / pt-BR
# (F-6 amendment from feature 005). Do NOT replace {0} with a hardcoded URL.
email.password.reset.subject=Restablece tu contraseña de Gifiti
email.password.reset.heading=Restablece tu contraseña
email.password.reset.body=Recibimos una solicitud para restablecer tu contraseña de Gifiti. Haz clic en el botón de abajo para elegir una nueva.
email.password.reset.cta=Restablecer contraseña
email.password.reset.fallback.notice=¿El botón no funciona? Copia y pega este enlace en tu navegador:
email.password.reset.fallback.link={0}
email.password.reset.ignore.notice=Si no solicitaste un restablecimiento de contraseña, puedes ignorar este correo con seguridad. Tu contraseña permanecerá sin cambios.
email.password.reset.footer.copyright=&copy; 2026 Gifiti. Todos los derechos reservados.
email.password.reset.footer.notice=Recibiste este correo porque solicitaste un restablecimiento de contraseña en
